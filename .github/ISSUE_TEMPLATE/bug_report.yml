name: Bug report
description: Report something that's broken or behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Include the relevant part of your `business.config.ts` if the bug is
        config-dependent (e.g. a specific hours/timezone combination).
      placeholder: |
        1. Set `timezone` to '...'
        2. Set hours to '...'
        3. Load the homepage at '...'
        4. See error
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. 22.x"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or screenshots
      render: shell
    validations:
      required: false
